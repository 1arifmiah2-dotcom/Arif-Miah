<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4338CA" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base (Android Adaptive Icon shape) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner ambient glow -->
  <circle cx="256" cy="180" r="160" fill="#818CF8" opacity="0.3" filter="blur(40px)" />

  <!-- Main Speech Bubble Shape -->
  <path d="M 120 220 C 120 142.68 180.88 80 256 80 C 331.12 80 392 142.68 392 220 C 392 297.32 331.12 360 256 360 C 232.8 360 210.8 354.1 191.6 343.8 L 132 364 C 121.2 367.6 111.4 357.2 115.6 346.6 L 132.8 303.4 C 124.6 278.4 120 250 120 220 Z" 
        fill="url(#bubbleGrad)" filter="url(#shadow)" />

  <!-- Brand Dynamic Aura Pulse / Spark -->
  <path d="M 200 220 Q 230 180 256 220 T 312 220" stroke="#4F46E5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="210" cy="220" r="10" fill="#4F46E5" />
  <circle cx="256" cy="220" r="12" fill="#7C3AED" />
  <circle cx="302" cy="220" r="10" fill="#06B6D4" />
</svg>
